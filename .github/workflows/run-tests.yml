name: run-tests

on: [push, pull_request]

jobs:
    tests:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                php: [8.2,8.3,8.4]
                # laravel 11 dropped from CI: it is EOL and every 11.x release
                # is blocked by composer's security-advisory policy, so the leg
                # can never install. The ^11 composer constraint remains for
                # existing consumers.
                laravel: [12.*,13.*]
                stability: [ prefer-stable ]
                dependency-version: [ prefer-stable]
                include:
                    -   laravel: 12.*
                        testbench: 10.*
                        filament: 4.*
                    -   laravel: 13.*
                        testbench: 11.*
                exclude:
                    -   php: 8.2
                        laravel: 13.*

        name: P${{ matrix.php }} - L${{ matrix.laravel }} - - ${{ matrix.stability }}  - ${{ matrix.dependency-version }}

        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            -   name: Install SQLite 3
                run: |
                    sudo apt-get update
                    sudo apt-get install sqlite3

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv
                    coverage: none

            -   name: Install dependencies
                run: |
                    composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                    composer update --${{ matrix.stability }} --prefer-dist --no-interaction

            -   name: Setup Problem Matches
                run: |
                    echo "::add-matcher::${{ runner.tool_cache }}/php.json"
                    echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            -   name: Execute tests
                run: composer test
